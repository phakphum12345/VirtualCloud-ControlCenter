name: Bootstrap Safety Audit

on:
  push:
    branches:
      - feature/bootstrap-safety-hardening-github
    paths:
      - bootstrap-control-plane.ps1
      - tests/bootstrap-control-plane-static-audit.ps1
      - .github/workflows/bootstrap-safety-audit.yml
  pull_request:
    branches:
      - feature/virtual-cloud-control-center
    paths:
      - bootstrap-control-plane.ps1
      - tests/bootstrap-control-plane-static-audit.ps1
      - .github/workflows/bootstrap-safety-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-static-audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse and audit with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/bootstrap-control-plane-static-audit.ps1
      - name: Parse and audit with PowerShell 7
        shell: pwsh
        run: ./tests/bootstrap-control-plane-static-audit.ps1
