name: Repository Quality

on:
  push:
    branches:
      - feature/virtual-cloud-control-center
    paths:
      - '**/*.py'
      - '*.py'
      - '**/*.ps1'
      - '*.ps1'
      - '**/*.yml'
      - '*.yml'
      - '**/*.yaml'
      - '*.yaml'
      - '**/*.md'
      - '*.md'
      - requirements*.txt
      - .github/workflows/repository-quality.yml
  pull_request:
    branches:
      - feature/virtual-cloud-control-center
    paths:
      - '**/*.py'
      - '*.py'
      - '**/*.ps1'
      - '*.ps1'
      - '**/*.yml'
      - '*.yml'
      - '**/*.yaml'
      - '*.yaml'
      - '**/*.md'
      - '*.md'
      - requirements*.txt
      - .github/workflows/repository-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q control_center.py bridge_worker.py tests

      - name: Run unit and contract tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build Windows Control Center
        shell: pwsh
        run: ./build-control-center.ps1 -Python python

      - name: Parse all YAML templates
        shell: pwsh
        run: |
          python -c "import pathlib, yaml; files=list(pathlib.Path('.').rglob('*.yml'))+list(pathlib.Path('.').rglob('*.yaml')); [yaml.safe_load(p.read_text(encoding='utf-8')) for p in files]; print(f'Parsed {len(files)} YAML files')"

      - name: Parse and audit with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/bootstrap-control-plane-static-audit.ps1

      - name: Parse and audit with PowerShell 7
        shell: pwsh
        run: ./tests/bootstrap-control-plane-static-audit.ps1
